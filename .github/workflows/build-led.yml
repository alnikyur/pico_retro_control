name: Build PicoSwitch LED test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Fetch fixed upstream revision and SDK
        run: |
          git clone https://github.com/juan518munoz/PicoSwitch-WirelessGamepadAdapter.git firmware
          git -C firmware checkout 11a69e97161807deb1120d729a62807fefafdfd4
          git -C firmware submodule update --init --recursive
          git clone --depth 1 --branch 1.5.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git pico-sdk
          cp src/pico_switch_platform.c firmware/src/pico_switch_platform.c
      - name: Build original Pico W firmware
        run: |
          cmake -S firmware -B build -DPICO_BOARD=pico_w -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          cp build/PicoSwitchWGA.uf2 build/PicoSwitchWGA-GP15-LED.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: PicoSwitchWGA-GP15-LED
          path: build/PicoSwitchWGA-GP15-LED.uf2
          if-no-files-found: error
